<!DOCTYPE html>
<lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>★ EUNSEOK'S WORLD ★</title>


<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #d8cce5;
    color: #555;
    font-family: "굴림", Gulim, Arial, sans-serif;
    font-size: 12px;
}

/* 배경 패턴 */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .25;
    background-image: radial-gradient(#ffffff 1px, transparent 1px);
    background-size: 12px 12px;
}

/* =====================================================
   전체 홈페이지
===================================================== */

#homepage {
    width: 960px;
    max-width: calc(100% - 30px);
    margin: 35px auto;
    background: #fff;
    border: 1px solid #777;
    box-shadow: 6px 6px 0 rgba(0,0,0,.2);
}

/* =====================================================
   HEADER
===================================================== */

header {
    position: relative;
    height: 120px;
    padding: 25px 30px;
    background: linear-gradient(135deg, #ffd7e8, #e6d5ff);
    border-bottom: 4px double #999;
    overflow: hidden;
}

header::before {
    content: "✦ · ★ · ✧ · ☆ · ✦";
    position: absolute;
    right: 20px;
    top: 15px;
    color: rgba(255,255,255,.8);
    font-size: 22px;
    letter-spacing: 8px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #e33c8d;
    text-shadow: 2px 2px 0 white;
}

.logo span {
    color: #8c68c9;
}

.header-sub {
    margin-top: 12px;
    color: #777;
    font-family: "Courier New", monospace;
}

.header-notice {
    position: absolute;
    right: 25px;
    bottom: 15px;
    font-size: 11px;
    color: #777;
}

/* =====================================================
   BODY LAYOUT
===================================================== */

.layout {
    display: grid;
    grid-template-columns: 210px 1fr;
    min-height: 600px;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    background: #f7f5fa;
    border-right: 1px solid #aaa;
    padding: 18px;
}

/* PROFILE */

.profile {
    text-align: center;
    padding-bottom: 18px;
    border-bottom: 1px dotted #aaa;
}

.profile-photo {
    width: 130px;
    height: 130px;
    margin: 0 auto 12px;
    border: 3px solid white;
    outline: 1px solid #999;
    background: #ddd;
    overflow: hidden;
}

.profile-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name {
    color: #d93682;
    font-weight: bold;
    font-size: 15px;
}

.profile-comment {
    margin-top: 8px;
    line-height: 1.7;
    color: #777;
}

.mood {
    margin-top: 12px;
    padding: 8px;
    background: #fff;
    border: 1px solid #ddd;
    font-size: 11px;
}

.mood strong {
    color: #e33c8d;
}

/* MENU */

.menu {
    margin-top: 20px;
}

.menu-title {
    color: #888;
    font-weight: bold;
    margin-bottom: 8px;
}

.menu button {
    display: block;
    width: 100%;
    padding: 10px 8px;
    margin-bottom: 4px;
    text-align: left;
    border: 0;
    border-bottom: 1px dotted #aaa;
    background: transparent;
    color: #555;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
}

.menu button:hover {
    background: #ffe2ef;
    color: #d93682;
}

.menu button.active {
    background: #f5c4da;
    color: #b52c6c;
    font-weight: bold;
}

/* BGM */

.bgm-box {
    margin-top: 25px;
    padding: 10px;
    border: 1px solid #ccc;
    background: #fff;
}

.bgm-title {
    color: #888;
    margin-bottom: 8px;
}

#bgmButton {
    width: 100%;
    padding: 6px;
    border: 1px solid #aaa;
    background: #eee;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
}

/* COUNTER */

.counter {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px dotted #aaa;
    text-align: center;
    font-family: "Courier New", monospace;
    color: #555;
}

.counter span {
    color: #e33c8d;
    font-weight: bold;
}

/* =====================================================
   MAIN
===================================================== */

main {
    padding: 25px;
    background: #fff;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.page-title {
    padding-bottom: 10px;
    margin-bottom: 18px;
    border-bottom: 2px solid #e8a5c3;
    color: #d93682;
    font-size: 18px;
    font-weight: bold;
}

.page-title small {
    margin-left: 8px;
    color: #aaa;
    font-size: 10px;
    font-weight: normal;
}

/* =====================================================
   HOME
===================================================== */

.welcome-box {
    padding: 18px;
    border: 1px solid #ddd;
    background: linear-gradient(#fff, #fff7fb);
    line-height: 1.9;
}

.welcome-title {
    color: #8c68c9;
    font-size: 16px;
    font-weight: bold;
}

.notice-box {
    margin-top: 20px;
    padding: 15px;
    background: #fffbe9;
    border: 1px dashed #d5b96b;
    line-height: 1.8;
}

.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
}

.mini-box {
    padding: 15px;
    background: #f9f9f9;
    border: 1px solid #ddd;
}

.mini-title {
    color: #d93682;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =====================================================
   PROFILE PAGE
===================================================== */

.profile-page {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 25px;
}

.big-profile {
    width: 170px;
    height: 210px;
    border: 4px solid white;
    outline: 1px solid #aaa;
    background: #eee;
    overflow: hidden;
}

.big-profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-table {
    width: 100%;
    border-collapse: collapse;
}

.profile-table th,
.profile-table td {
    border: 1px solid #ddd;
    padding: 10px;
}

.profile-table th {
    width: 100px;
    background: #f5e9f0;
    color: #b52c6c;
}

.profile-table td {
    background: #fff;
}

/* =====================================================
   DIARY
===================================================== */

.diary-entry {
    margin-bottom: 20px;
    border: 1px solid #ccc;
}

.diary-head {
    padding: 8px 12px;
    background: #f2edf8;
    border-bottom: 1px solid #ccc;
    color: #7956a9;
    font-weight: bold;
}

.diary-body {
    padding: 15px;
    line-height: 1.9;
}

.diary-date {
    float: right;
    color: #999;
    font-weight: normal;
    font-size: 10px;
}

/* =====================================================
   PHOTO
===================================================== */

.photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.photo-card {
    padding: 7px;
    background: white;
    border: 1px solid #bbb;
    box-shadow: 2px 2px 0 #ddd;
    cursor: pointer;
    transition: transform .15s;
}

.photo-card:hover {
    transform: rotate(-1deg) scale(1.02);
}

.photo-card img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
}

.photo-caption {
    padding: 8px 3px 3px;
    color: #777;
    text-align: center;
    font-size: 11px;
}

/* =====================================================
   PHOTO MODAL
===================================================== */

#photoModal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.75);
}

#photoModal.show {
    display: flex;
}

.modal-inner {
    position: relative;
    max-width: 85vw;
    max-height: 85vh;
    padding: 10px;
    background: white;
    box-shadow: 5px 5px 0 #222;
}

.modal-inner img {
    display: block;
    max-width: 80vw;
    max-height: 75vh;
    object-fit: contain;
}

.modal-close {
    position: absolute;
    top: -28px;
    right: 0;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

/* =====================================================
   GUESTBOOK
===================================================== */

.guest-intro {
    padding: 12px;
    margin-bottom: 18px;
    background: #fff8fc;
    border: 1px solid #ecc3d6;
    line-height: 1.7;
}

.guest-form {
    padding: 15px;
    background: #f7f7f7;
    border: 1px solid #ccc;
    margin-bottom: 20px;
}

.guest-form label {
    display: block;
    margin-bottom: 5px;
    color: #777;
    font-weight: bold;
}

.guest-form input,
.guest-form textarea {
    width: 100%;
    border: 1px solid #aaa;
    padding: 8px;
    margin-bottom: 10px;
    font-family: "굴림", Gulim, sans-serif;
    font-size: 12px;
}

.guest-form textarea {
    height: 80px;
    resize: vertical;
}

.guest-form button {
    padding: 8px 18px;
    border: 2px outset #f1a6c6;
    background: #ed72a8;
    color: white;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
}

.guest-form button:active {
    border-style: inset;
}

#guestStatus {
    margin-left: 10px;
    color: #888;
}

.guest-item {
    margin-bottom: 12px;
    border: 1px solid #ccc;
}

.guest-head {
    display: flex;
    justify-content: space-between;
}
